<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Savannah CHS – Vehicle Records</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header img {
      max-height: 90px;
      display: block;
      margin: 0 auto 4px auto; /* small gap below logo */
    }
    .tagline {
      font-style: italic;
      color: #666;
      margin: 0 0 6px 0; /* directly under logo */
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 15px;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      width: 100%;
      background: #2c7be5;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background: #2c7be5;
      color: white;
    }
    tr:nth-child(even) {
      background: #f2f2f2;
    }
    #errorMsg {
      display: none;
      color: #b00020;
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
    }
    .note {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- HEADER WITH LOGO -->
    <div class="header">
      <img src="https://drive.google.com/thumbnail?id=1S-8K9LeZ_WDqn1zvzUC5-HksTm1GBj4g&sz=w300" alt="Savannah CHS Logo" />
      <div class="tagline">A Legacy of Elegant Living</div>
      <h1>Vehicle Registration Records</h1>
    </div>
    </div>

    <p style="text-align:center; color:#444;">
      Please enter your <b>Flat Number</b> and <b>Email ID</b> entered during Google Form submission to view your submitted details.
    </p>

    <input type="text" id="flatInput" autocomplete="off" placeholder="Enter Flat Number (e.g. K-103)" />
    <input type="email" id="emailInput" autocomplete="off" placeholder="Enter Email ID (same as used in Google Form)" />

    <button onclick="validateAndSearch()">View My Details</button>

    <p id="errorMsg"></p>

    <table id="dataTable" style="display:none;">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div class="note">
      ℹ️ Data is fetched live from Google Form master sheet. View-only.
    </div>

  </div>

  <script>
    // ================= CONFIG =================
    const SHEET_ID = "1hD0ph0guA7-EEFyN_N2sp4AIoKYNJ1jQDbqr8sfcRtg";
    const SHEET_NAME = "Form Responses 1";
    const url = `https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(SHEET_NAME)}`;

    let allRows = [];

    // ================= FETCH DATA =================
    fetch(url)
      .then(res => res.json())
      .then(data => {
        allRows = Array.isArray(data) ? data : [];
      })
      .catch(() => {
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.textContent = 'Unable to load data. Please try again later.';
        errorMsg.style.display = 'block';
      });

    // ================= RENDER TABLE =================
    function renderTable(data) {
      const thead = document.getElementById("tableHead");
      const tbody = document.getElementById("tableBody");
      thead.innerHTML = "";
      tbody.innerHTML = "";

      if (!data || data.length === 0) return;

      const headerRow = document.createElement('tr');
      Object.keys(data[0]).forEach(col => {
        const th = document.createElement('th');
        th.textContent = col;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);

      data.forEach(row => {
        const tr = document.createElement('tr');
        Object.keys(data[0]).forEach(col => {
          const td = document.createElement('td');
          td.textContent = row[col] ?? '';
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    // ================= VALIDATION + SEARCH =================
    function validateAndSearch() {
      const flatVal = document.getElementById("flatInput").value.trim().toUpperCase();
      const emailVal = document.getElementById("emailInput").value.trim().toLowerCase();
      const errorMsg = document.getElementById("errorMsg");
      const table = document.getElementById("dataTable");

      errorMsg.style.display = "none";
      errorMsg.textContent = "";
      table.style.display = "none";

      if (!flatVal || !emailVal) {
        errorMsg.textContent = "Please enter both Flat Number and Email ID.";
        errorMsg.style.display = "block";
        return;
      }

      // Flat format validation: K-103, A1-101, P-1101
      const flatPattern = /^[A-Z]{1,2}[0-9]?\-\d{3,4}$/;
      if (!flatPattern.test(flatVal)) {
        errorMsg.textContent = "Enter flat no in proper format (e.g. K-103)";
        errorMsg.style.display = "block";
        return;
      }

      const filtered = allRows.filter(row => {
        const flat = (row['Flat Number'] || row['Flat No'] || row['Flat'] || '').toUpperCase();
        const email = (row['Email Address'] || row['Email'] || '').toLowerCase();
        return flat === flatVal && email === emailVal;
      });

      if (filtered.length === 0) {
        errorMsg.textContent = "❌ No records found. Please ensure Flat Number and Email ID are the same as entered in the Google Form.";
        errorMsg.style.display = "block";
        return;
      }

      table.style.display = "table";
      renderTable(filtered);
    }
  </script>

</body>
</html>
